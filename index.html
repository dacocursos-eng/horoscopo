<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horóscopo de la semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#071631; --navy2:#0c2550; --gold:#e3b65b; --teal:#3cc4c0; --ink:#e9eef7; --muted:#9fb0c8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); font-family:"Inter",system-ui,sans-serif;
         background: radial-gradient(1200px 600px at 80% -10%, #16407a 0%, transparent 60%),
                     radial-gradient(900px 500px at 0% 110%, #0f4560 0%, transparent 60%), var(--navy); }
  #stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .wrap { position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:56px 28px 64px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:40px; }
  .eyebrow { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--teal); font-weight:600; }
  h1 { font-family:"Fraunces",serif; font-weight:600; font-size:clamp(34px,5vw,56px); margin:10px 0 6px; line-height:1.05; }
  .fecha { color:var(--muted); font-size:15px; }
  .transitos { display:none; margin:-14px 0 30px; padding:14px 20px; border-radius:14px; background:rgba(60,196,192,.08); border:1px solid rgba(60,196,192,.3); color:#cfe9ec; font-size:15px; line-height:1.55; }
  .transitos b { color:var(--teal); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:12px; margin-right:10px; }
  .acciones { display:flex; align-items:center; gap:16px; }
  .vivo { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .vivo i { width:9px; height:9px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 0 rgba(60,196,192,.7); animation:pulso 2s infinite; }
  @keyframes pulso { 0%{box-shadow:0 0 0 0 rgba(60,196,192,.7)} 70%{box-shadow:0 0 0 10px rgba(60,196,192,0)} 100%{box-shadow:0 0 0 0 rgba(60,196,192,0)} }
  .editar { display:none; text-decoration:none; color:var(--navy); background:var(--gold); font-weight:600; font-size:14px; padding:10px 18px; border-radius:999px; }
  .editar:hover { filter:brightness(1.08); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:18px; }
  .card { background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border:1px solid rgba(227,182,91,.22);
          border-radius:18px; padding:22px 22px 24px; opacity:0; transform:translateY(14px); animation:entra .6s ease forwards; }
  @keyframes entra { to { opacity:1; transform:none; } }
  .card .top { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .simbolo { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:24px; color:var(--gold);
             border:1px solid rgba(227,182,91,.5); background:rgba(227,182,91,.08); font-family:"Segoe UI Symbol","DejaVu Sans",sans-serif; }
  .signo { font-family:"Fraunces",serif; font-size:23px; font-weight:600; }
  .fechas { font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .texto { font-size:15.5px; line-height:1.6; color:#d9e2f0; margin:0; }
  .nuevo { position:fixed; left:50%; top:22px; transform:translateX(-50%) translateY(-120px); background:var(--teal); color:var(--navy);
           font-weight:600; padding:10px 20px; border-radius:999px; transition:transform .5s ease; z-index:5; }
  .nuevo.ver { transform:translateX(-50%) translateY(0); }
  footer { margin-top:44px; color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nuevo" id="aviso">Horóscopo actualizado</div>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Lo que dicen las estrellas</div>
      <h1 id="titulo">Horóscopo de la semana</h1>
      <div class="fecha" id="fecha"></div>
    </div>
    <div class="acciones">
      <span class="vivo"><i></i>En vivo</span>
      <a class="editar" id="editar" target="_blank" rel="noopener">Editar horóscopo</a>
    </div>
  </header>
  <div class="transitos" id="transitos"><b>Tránsitos</b><span id="transitosTexto"></span></div>
  <section class="grid" id="grid"></section>
</div>
<script>
const SIGNOS = {
  "Aries":["♈︎","21 mar - 19 abr"], "Tauro":["♉︎","20 abr - 20 may"], "Géminis":["♊︎","21 may - 20 jun"],
  "Cáncer":["♋︎","21 jun - 22 jul"], "Leo":["♌︎","23 jul - 22 ago"], "Virgo":["♍︎","23 ago - 22 sep"],
  "Libra":["♎︎","23 sep - 22 oct"], "Escorpio":["♏︎","23 oct - 21 nov"], "Sagitario":["♐︎","22 nov - 21 dic"],
  "Capricornio":["♑︎","22 dic - 19 ene"], "Acuario":["♒︎","20 ene - 18 feb"], "Piscis":["♓︎","19 feb - 20 mar"]
};
const sinTildes = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const MAPA = Object.fromEntries(Object.keys(SIGNOS).map(k => [sinTildes(k), k]));
// Identificador de la hoja de Google (el texto entre /d/ y /edit en el enlace de la hoja).
const HOJA_ID = "";
const FUENTE = HOJA_ID
  ? `https://docs.google.com/spreadsheets/d/${HOJA_ID}/gviz/tq?tqx=out:csv`
  : "horoscopo.csv";
let ultimo = null;

function csv(txt) {
  const filas = []; let fila = [], campo = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i+1] === '"') { campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === ",") { fila.push(campo); campo = ""; }
    else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}

function leer(txt) {
  const datos = { titulo:"Horóscopo de la semana", fecha:"", transitos:"", signos:[] };
  for (const [c0 = "", c1 = ""] of csv(txt)) {
    const clave = c0.trim(), valor = c1.trim();
    const k = sinTildes(clave);
    if (k === "titulo") datos.titulo = valor;
    else if (k === "fecha") datos.fecha = valor;
    else if (k === "transitos") datos.transitos = valor;
    else if (MAPA[k] && valor) datos.signos.push([MAPA[k], valor]);
  }
  return datos;
}

function pintar(d) {
  document.getElementById("titulo").textContent = d.titulo;
  document.getElementById("fecha").textContent = d.fecha;
  document.title = d.titulo;
  const t = document.getElementById("transitos");
  document.getElementById("transitosTexto").textContent = d.transitos;
  t.style.display = d.transitos ? "block" : "none";
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  d.signos.forEach(([signo, texto], n) => {
    const c = document.createElement("article"); c.className = "card"; c.style.animationDelay = (n*0.06)+"s";
    c.innerHTML = `<div class="top"><div class="simbolo">${SIGNOS[signo][0]}</div><div><div class="signo">${signo}</div><div class="fechas">${SIGNOS[signo][1]}</div></div></div><p class="texto"></p>`;
    c.querySelector(".texto").textContent = texto;
    grid.appendChild(c);
  });
}

async function cargar() {
  try {
    const r = await fetch(FUENTE + (FUENTE.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    if (txt === ultimo) return;
    const primera = ultimo === null; ultimo = txt;
    pintar(leer(txt));
    if (!primera) { const a = document.getElementById("aviso"); a.classList.add("ver"); setTimeout(() => a.classList.remove("ver"), 4000); }
  } catch (e) {}
}

(function enlaceEditar() {
  if (!HOJA_ID) return;
  const a = document.getElementById("editar");
  a.href = `https://docs.google.com/spreadsheets/d/${HOJA_ID}/edit`;
  a.style.display = "inline-block";
})();

(function estrellas() {
  const cv = document.getElementById("stars"), cx = cv.getContext("2d"); let pts = [];
  function tam() { cv.width = innerWidth; cv.height = innerHeight;
    pts = Array.from({length: Math.round(innerWidth*innerHeight/9000)}, () => ({x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.3+.2, f:Math.random()*Math.PI*2})); }
  function paso(t) { cx.clearRect(0,0,cv.width,cv.height);
    for (const p of pts) { cx.globalAlpha = .35 + .35*Math.sin(t/900 + p.f); cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
    requestAnimationFrame(paso); }
  addEventListener("resize", tam); tam(); requestAnimationFrame(paso);
})();

cargar();
setInterval(cargar, 15000);
</script>
</body>
</html>
